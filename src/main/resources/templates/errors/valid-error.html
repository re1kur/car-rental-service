<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Validation error — RentCar</title>
    <link rel="stylesheet" th:href="@{/css/styles-common.css}">
    <link rel="stylesheet" th:href="@{/css/styles-header.css}">
</head>
<body>

<header>
    <div th:replace="~{fragments/header :: pages}"></div>
</header>

<div class="container">
    <section>
        <h1>Validation failed</h1>
        <ul class="spec-list">
            <li th:each="error : ${errors}">
                <span class="v" th:text="${error}"></span>
            </li>
        </ul>
        <a th:href="${referer}" class="btn btn-outline">Back</a>
    </section>
</div>

<footer th:replace="~{fragments/footer :: main-footer}"></footer>
</body>
</html>
