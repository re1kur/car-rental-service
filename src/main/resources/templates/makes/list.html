<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Makes — RentCar</title>
    <link rel="stylesheet" th:href="@{/css/styles-common.css}">
    <link rel="stylesheet" th:href="@{/css/styles-header.css}">
    <link rel="stylesheet" th:href="@{/css/styles-list.css}">
</head>
<body>

<header>
    <div th:replace="~{fragments/header :: pages}"></div>
</header>

<div class="container">

    <div class="section-head">
        <div>
            <h1>Makes</h1>
            <p>Browse car brands.</p>
        </div>
        <a sec:authorize="hasRole('ADMIN')" class="btn" th:href="@{/makes/create}">+ New make</a>
    </div>

    <section class="filter-container">
        <form th:action="@{/makes}" method="get" class="filter-form">
            <div class="form-group">
                <label for="name">Name</label>
                <input type="text" name="name" id="name" th:value="${name}" class="form-control"
                       placeholder="Enter name">
            </div>
            <button type="submit">Find</button>
        </form>
    </section>

    <p th:if="${page.content.empty}" class="empty">No makes found.</p>

    <div class="card-grid" th:unless="${page.content.empty}">
        <div class="card" th:each="make : ${page.content}">
            <div class="card-media contain">
                <img th:src="${make.titleImage != null} ? ${make.titleImage.url} : @{/img/make-placeholder.svg}"
                     th:alt="${make.name}">
            </div>
            <div class="card-body">
                <h3 class="card-title">
                    <a th:href="@{/makes/{id}(id=${make.id})}" th:text="${make.name}"></a>
                </h3>
                <div class="card-actions" style="display:flex; gap:8px;">
                    <a class="btn btn-outline" th:href="@{/makes/{id}(id=${make.id})}">Profile</a>
                    <a class="btn" th:href="@{/cars(makeId=${make.id})}">Cars</a>
                </div>
            </div>
        </div>
    </div>

    <nav class="pagination" th:if="${page.totalCount > 1}" aria-label="Pagination">
        <a th:each="i : ${#numbers.sequence(0, page.totalCount - 1)}"
           th:href="@{/makes(page=${i}, name=${name})}"
           class="page-link" th:classappend="${i == page.number} ? 'active' : ''"
           th:text="${i + 1}"></a>
    </nav>

</div>

<footer th:replace="~{fragments/footer :: main-footer}"></footer>
</body>
</html>
