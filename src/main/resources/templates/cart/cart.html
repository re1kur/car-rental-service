<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Cart — RentCar</title>
    <link rel="stylesheet" th:href="@{/css/styles-common.css}">
    <link rel="stylesheet" th:href="@{/css/styles-header.css}">
</head>
<body>

<header>
    <div th:replace="~{fragments/header :: pages}"></div>
</header>

<div class="container">

    <div class="section-head">
        <div>
            <h1>Your cart</h1>
            <p>Cars selected to rent — set dates and book them all at once.</p>
        </div>
        <a th:href="@{/cars}" class="btn btn-outline">Continue browsing</a>
    </div>

    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <p th:if="${#lists.isEmpty(lines)}" class="empty">
        Your cart is empty. <a th:href="@{/cars}">Browse cars</a>.
    </p>

    <div th:unless="${#lists.isEmpty(lines)}">

        <div class="cart-item" th:each="line : ${lines}">
            <div class="thumb">
                <img th:src="${line.car.titleImage != null} ? ${line.car.titleImage.url} : @{/img/car-placeholder.svg}"
                     th:alt="${line.car.model}">
            </div>

            <div class="info">
                <h3 class="card-title">
                    <a th:href="@{/cars/{id}(id=${line.car.id})}"
                       th:text="${line.car.make.name} + ' ' + ${line.car.model}"></a>
                </h3>
                <p class="card-meta">
                    <span th:text="'$' + ${line.car.cost} + ' / day'"></span>
                    <span>·</span>
                    <span th:text="${line.days} + ' day(s)'"></span>
                </p>

                <form class="dates" method="post" th:action="@{/cart/items/{id}(id=${line.car.id})}">
                    <div>
                        <label>From</label>
                        <input type="date" name="startDate" th:value="${line.startDate}" required>
                    </div>
                    <div>
                        <label>To</label>
                        <input type="date" name="endDate" th:value="${line.endDate}" required>
                    </div>
                    <button class="btn btn-outline" type="submit">Update dates</button>
                </form>
            </div>

            <div class="right">
                <div class="subtotal" th:text="'$' + ${line.subtotal}"></div>
                <form method="post" th:action="@{/cart/remove/{id}(id=${line.car.id})}">
                    <button class="btn" type="submit">Remove</button>
                </form>
            </div>
        </div>

        <div class="cart-summary">
            <span class="grand">Total: <span th:text="'$' + ${total}"></span></span>
            <form method="post" th:action="@{/cart/checkout}">
                <button class="btn" type="submit">Checkout — book all</button>
            </form>
        </div>

    </div>

</div>

<footer th:replace="~{fragments/footer :: main-footer}"></footer>
</body>
</html>
