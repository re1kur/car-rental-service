<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Cart — RentCar</title>
    <link rel="stylesheet" th:href="@{/css/styles-common.css}">
    <link rel="stylesheet" th:href="@{/css/styles-header.css}">
    <link rel="stylesheet" th:href="@{/css/styles-interactive.css}">
</head>
<body>

<header>
    <div th:replace="~{fragments/header :: pages}"></div>
</header>

<div class="container">

    <div class="section-head">
        <div>
            <h1>Your cart</h1>
            <p>Cars selected to rent — set dates and book them all at once.</p>
        </div>
        <a th:href="@{/cars}" class="btn btn-outline">Continue browsing</a>
    </div>

    <div class="alert-error" th:if="${error}" th:text="${error}"></div>

    <p th:if="${#lists.isEmpty(lines)}" class="empty">
        Your cart is empty. <a th:href="@{/cars}">Browse cars</a>.
    </p>

    <div th:unless="${#lists.isEmpty(lines)}" data-cart-root>

        <div class="cart-item" th:each="line : ${lines}" th:attr="data-car-id=${line.car.id}">
            <div class="thumb">
                <img th:src="${line.car.titleImage != null} ? ${line.car.titleImage.url} : @{/img/car-placeholder.svg}"
                     th:alt="${line.car.model}">
            </div>

            <div class="info">
                <h3 class="card-title">
                    <a th:href="@{/cars/{id}(id=${line.car.id})}"
                       th:text="${line.car.make.name} + ' ' + ${line.car.model}"></a>
                </h3>
                <p class="card-meta">
                    <span th:text="'$' + ${line.car.cost} + ' / day'"></span>
                </p>

                <div class="qty-stepper">
                    <button type="button" class="btn btn-outline qty-btn" data-step="-1"
                            aria-label="Decrease days">&minus;</button>
                    <span class="qty" data-qty th:text="${line.days}">1</span>
                    <span class="qty-unit">day(s)</span>
                    <button type="button" class="btn btn-outline qty-btn" data-step="1"
                            aria-label="Increase days">+</button>
                </div>

                <div class="dates">
                    <div>
                        <label>From</label>
                        <input type="date" name="startDate" th:value="${line.startDate}">
                    </div>
                    <div>
                        <label>To</label>
                        <input type="date" name="endDate" th:value="${line.endDate}">
                    </div>
                </div>
            </div>

            <div class="right">
                <div class="subtotal" data-subtotal th:text="'$' + ${line.subtotal}"></div>
                <button class="btn" type="button" data-remove>Remove</button>
            </div>
        </div>

        <div class="cart-summary">
            <span class="grand">Total: <span data-total th:text="'$' + ${total}"></span></span>
            <form method="post" th:action="@{/cart/checkout}">
                <button class="btn" type="submit">Checkout — book all</button>
            </form>
        </div>

    </div>

</div>

<footer th:replace="~{fragments/footer :: main-footer}"></footer>
<script th:src="@{/js/notify.js}"></script>
<script th:src="@{/js/cart.js}"></script>
</body>
</html>
