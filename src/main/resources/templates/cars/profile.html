<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title th:text="${car.make.name} + ' ' + ${car.model} + ' — RentCar'"></title>
    <link rel="stylesheet" th:href="@{/css/styles-common.css}">
    <link rel="stylesheet" th:href="@{/css/styles-header.css}">
    <link rel="stylesheet" sec:authorize="isAuthenticated()" th:href="@{/css/styles-form.css}">
    <link rel="stylesheet" th:href="@{/css/styles-interactive.css}">
</head>
<body>

<header>
    <div th:replace="~{fragments/header :: pages}"></div>
</header>

<div class="container">

    <div class="section-head">
        <div>
            <h1 th:text="${car.make.name} + ' ' + ${car.model}"></h1>
            <span class="badge" th:classappend="${car.available} ? 'ok' : 'no'"
                  data-availability-badge
                  th:text="${car.available} ? 'Available' : 'Not available'"></span>
        </div>
        <div sec:authorize="hasRole('ADMIN')" class="header-actions">
            <button type="button" class="btn btn-outline" data-toggle-availability
                    th:attr="data-car-id=${car.id},data-available=${car.available}"
                    th:text="${car.available} ? 'Set unavailable' : 'Set available'"></button>
            <a class="btn btn-outline" th:href="@{/cars/{id}/update(id=${car.id})}">Edit car</a>
        </div>
    </div>

    <div class="product-layout">

        <div>
            <div class="main-image">
                <img class="zoomable"
                     th:src="${car.titleImage != null} ? ${car.titleImage.url} : @{/img/car-placeholder.svg}"
                     th:alt="${car.make.name} + ' ' + ${car.model}">
            </div>

            <ul class="thumbs" th:if="${car.images != null and !#lists.isEmpty(car.images)}">
                <li th:each="image : ${car.images}">
                    <div class="image-container">
                        <img class="zoomable" th:src="${image.url}" th:attr="data-full=${image.url}" alt="Image">
                    </div>
                </li>
            </ul>
        </div>

        <div class="product-panel">
            <div class="price-box">
                <span class="amount" th:text="'$' + ${car.cost}"></span>
                <span class="per">/ day</span>
            </div>

            <ul class="spec-list">
                <li><span class="k">Make</span><span class="v" th:text="${car.make.name}"></span></li>
                <li><span class="k">Model</span><span class="v" th:text="${car.model}"></span></li>
                <li><span class="k">Type</span><span class="v" th:text="${car.carType.label}"></span></li>
                <li><span class="k">Engine</span><span class="v" th:text="${car.engine.label}"></span></li>
                <li><span class="k">Year</span><span class="v" th:text="${car.year}"></span></li>
                <li><span class="k">License plate</span><span class="v" th:text="${car.licensePlate}"></span></li>
            </ul>

            <div th:if="${car.available}">
                <div style="margin-bottom:14px;">
                    <div th:replace="~{fragments/cart :: addButton(${car.id})}"></div>
                </div>
                <form sec:authorize="isAuthenticated()" method="post" th:action="@{/rentals/create}" class="edit-form"
                      data-rent-form th:attr="data-day-price=${car.cost}">
                    <input type="hidden" th:value="${car.id}" name="carId">
                    <div class="form-group">
                        <label for="startDate">Start date</label>
                        <input type="date" name="startDate" id="startDate"
                               th:value="${payload != null ? payload.startDate : ''}" required>
                    </div>
                    <div class="form-group">
                        <label for="endDate">End date</label>
                        <input type="date" name="endDate" id="endDate"
                               th:value="${payload != null ? payload.endDate : ''}" required>
                    </div>
                    <p class="rent-total" data-rent-total></p>
                    <div class="form-actions">
                        <button type="submit">Rent now</button>
                    </div>
                </form>
                <p sec:authorize="!isAuthenticated()" class="card-meta" style="margin-top:14px;">
                    <a th:href="@{/oauth2/authorization/keycloak}">Log in</a>&nbsp;to rent this car.
                </p>
            </div>
            <p th:unless="${car.available}" class="badge no" style="margin-top:8px;">
                Currently not available for rent
            </p>
        </div>
    </div>

    <section th:if="${car.information}">
        <h2>Additional information</h2>
        <ul class="spec-list">
            <li th:if="${car.information.description}">
                <span class="k">Description</span><span class="v" th:text="${car.information.description}"></span></li>
            <li th:if="${car.information.color}">
                <span class="k">Color</span><span class="v" th:text="${car.information.color}"></span></li>
            <li th:if="${car.information.seats}">
                <span class="k">Seats</span><span class="v" th:text="${car.information.seats}"></span></li>
            <li th:if="${car.information.mileage}">
                <span class="k">Mileage</span><span class="v" th:text="${car.information.mileage}"></span></li>
            <li th:if="${car.information.fuelType}">
                <span class="k">Fuel type</span><span class="v" th:text="${car.information.fuelType}"></span></li>
            <li th:if="${car.information.transmission}">
                <span class="k">Transmission</span><span class="v" th:text="${car.information.transmission}"></span></li>
        </ul>
    </section>

</div>

<footer th:replace="~{fragments/footer :: main-footer}"></footer>
<script th:src="@{/js/notify.js}"></script>
<script th:src="@{/js/cart.js}"></script>
<script th:src="@{/js/lightbox.js}"></script>
<script th:src="@{/js/rent-preview.js}"></script>
<script th:src="@{/js/car-admin.js}"></script>
</body>
</html>
