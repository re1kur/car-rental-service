<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" th:href="@{/css/styles-login.css}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jsencrypt/3.2.1/jsencrypt.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('registerForm');
            const publicKeyPem = document.getElementById('publicKey').value;

            form.addEventListener('submit', function(e) {
                e.preventDefault();

                // Получаем значения из формы
                const email = document.getElementById('emailInput').value;
                const password = document.getElementById('passwordInput').value;
                const confirmPassword = document.getElementById('confirmPassword').value;

                // Проверяем заполнение полей
                if (!email || !password || !confirmPassword) {
                    alert('Please fill in all fields');
                    return;
                }

                // Проверяем email
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                if (!emailRegex.test(email)) {
                    alert('Please enter a valid email address');
                    return;
                }

                // Проверяем совпадение паролей
                if (password !== confirmPassword) {
                    alert('Passwords do not match');
                    return;
                }

                // Показываем индикатор шифрования
                document.getElementById('encryptionStatus').style.display = 'block';

                // Шифруем данные
                const encrypt = new JSEncrypt();
                encrypt.setPublicKey(publicKeyPem);

                const encryptedEmail = encrypt.encrypt(email);
                const encryptedPassword = encrypt.encrypt(password);

                if (!encryptedEmail || !encryptedPassword) {
                    alert('Encryption failed. Please try again.');
                    document.getElementById('encryptionStatus').style.display = 'none';
                    return;
                }

                // Устанавливаем зашифрованные значения в скрытые поля
                document.getElementById('encryptedEmail').value = encryptedEmail;
                document.getElementById('encryptedPassword').value = encryptedPassword;

                // Очищаем поля ввода
                document.getElementById('emailInput').value = '';
                document.getElementById('passwordInput').value = '';
                document.getElementById('confirmPassword').value = '';

                // Отправляем форму
                setTimeout(() => {
                    form.submit();
                }, 500);
            });
        });
    </script>
</head>
<body>
<div class="container">
    <h1>Register</h1>

    <!-- Скрытые поля -->
    <input type="hidden" id="publicKey" th:value="${publicKey}">

    <!-- Сообщения об ошибках -->
    <div th:if="${error}" class="error-message" th:text="${error}">
        Error message here
    </div>

    <!-- Форма регистрации -->
    <form id="registerForm" th:action="@{/auth/register}" method="post" class="login-form">
        <!-- Скрытые поля для зашифрованных данных -->
        <input type="hidden" id="encryptedEmail" name="encryptedEmail">
        <input type="hidden" id="encryptedPassword" name="encryptedPassword">

        <!-- Поля для ввода (не отправляются на сервер напрямую) -->
        <div class="form-group">
            <label for="emailInput">Email</label>
            <input type="email" id="emailInput" placeholder="Enter your email" required
                   autocomplete="email" autofocus/>
        </div>
        <div class="form-group">
            <label for="passwordInput">Password</label>
            <input type="password" id="passwordInput" placeholder="Enter your password" required
                   autocomplete="new-password"/>
        </div>
        <div class="form-group">
            <label for="confirmPassword">Confirm Password</label>
            <input type="password" id="confirmPassword" placeholder="Confirm your password" required
                   autocomplete="new-password"/>
        </div>
        <div class="form-group">
            <button type="submit" class="btn btn-primary">Register</button>
        </div>
    </form>

    <!-- Ссылка на логин -->
    <div class="login-link">
        <p>Already have an account? <a th:href="@{/auth/login}">Login here</a></p>
    </div>

    <!-- Индикатор шифрования -->
    <div id="encryptionStatus" style="display:none; margin-top: 20px; text-align: center;">
        <div class="spinner"></div>
        <p>Securing your registration information...</p>
    </div>
</div>

<style>
    .spinner {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #3498db;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
        margin: 0 auto 10px;
    }

    @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
    }
</style>
</body>
</html>
