<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.w3.org/1999/xhtml">
<head>
    <meta charset="UTF-8">
    <title>Navigation</title>
</head>
<body>

<div sec:authorize="hasRole('ADMIN')" th:fragment="createMake">
    <a class="header-link" th:href="@{/makes/create}">
        New make
    </a>
</div>

<div sec:authorize="hasRole('ADMIN')" th:fragment="updateMake">
    <a class="header-link" th:href="@{/makes/{id}/update(id=${make.id})}">
        Update make
    </a>
</div>

<div sec:authorize="hasRole('ADMIN')" th:fragment="createCar">
    <a class="header-link" th:href="@{/cars/create}">
        New car
    </a>
</div>

<div sec:authorize="hasRole('ADMIN')" th:fragment="updateCar">
    <a class="header-link" th:href="@{/cars/{id}/update(id=${car.id})}">
        Update car
    </a>
</div>

<div sec:authorize="hasRole('ADMIN')" th:fragment="usersRentals">
    <a class="header-link" sec:authorize="hasRole('ADMIN')" th:href="@{/rentals/users}">
        User's rentals
    </a>
</div>

<nav th:fragment="pages" class="navbar">
    <a class="brand" th:href="@{/}">RentCar<span class="dot">.</span></a>
    <a class="header-link" th:href="@{/cars}">Cars</a>
    <a class="header-link" th:href="@{/makes}">Makes</a>
    <a class="header-link" sec:authorize="isAuthenticated()" th:href="@{/rentals}">Rentals</a>
    <span class="nav-auth">
        <a class="header-link icon-link" th:href="@{/chat}" title="Chat" aria-label="Chat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"></path>
            </svg>
        </a>
        <a class="header-link icon-link" sec:authorize="hasRole('ADMIN')" th:href="@{/admin/menu}"
           title="Admin" aria-label="Admin">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="12" cy="12" r="3"></circle>
                <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
        </a>
        <span class="notif-wrap">
            <button class="header-link icon-link" type="button" data-notif-bell title="Notifications" aria-label="Notifications">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                    <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                </svg>
                <span class="notif-badge hidden" data-notif-badge></span>
            </button>
            <div class="notif-panel" data-notif-panel hidden>
                <div class="notif-head">
                    <strong>Notifications</strong>
                    <button type="button" class="notif-toggle" data-notif-toggle>Subscribe</button>
                </div>
                <form class="notif-form" data-notif-form sec:authorize="hasRole('ADMIN')">
                    <input type="text" name="title" placeholder="Title" maxlength="120" required>
                    <input type="text" name="body" placeholder="Message" maxlength="500" required>
                    <button type="submit">Broadcast</button>
                </form>
                <ul class="notif-list" data-notif-list></ul>
            </div>
        </span>
        <a class="header-link cart-link" sec:authorize="isAuthenticated()" th:href="@{/cart}" title="Cart" aria-label="Cart">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="9" cy="21" r="1"></circle>
                <circle cx="20" cy="21" r="1"></circle>
                <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
            </svg>
            <span class="cart-badge" th:classappend="${cartCount == null or cartCount == 0} ? 'hidden' : ''"
                  th:text="${cartCount != null and cartCount > 0 ? cartCount : ''}"></span>
        </a>
        <a class="header-link" sec:authorize="isAuthenticated()" th:href="@{/oauth2/account}">Profile</a>
        <a class="header-link" sec:authorize="isAuthenticated()" th:href="@{/logout}">Log out</a>
        <a class="header-link" sec:authorize="!isAuthenticated()" th:href="@{/oauth2/authorization/keycloak}">Log in</a>
    </span>
    <link rel="stylesheet" th:href="@{/css/styles-notifications.css}">
    <script th:src="@{/js/notifications.js}"></script>
</nav>
</body>
</html>
