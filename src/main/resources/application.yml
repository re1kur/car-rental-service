spring:
  application:
    name: car-rent
  liquibase:
    change-log: db/changelog/db.changelog-master.yml
  jpa:
    generate-ddl: false
    show-sql: false
  datasource:
    url: jdbc:postgresql://localhost:5432/${POSTGRES_DB:developer}
    username: ${POSTGRES_USER:developer}
    password: ${POSTGRES_PASSWORD:developer}
  devtools:
    add-properties: false
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: car-rental-app
            client-secret: kvTfHzdUWRInkgRNmN6Ruixl2KuBhB8E
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/keycloak"
            scope: openid
        provider:
          keycloak:
            issuer-uri: http://localhost:9090/realms/rental-service-realm
            user-name-attribute: preferred_username
  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 30MB
server:
  tomcat:
    max-part-count: 20
  port: 8080

custom:
  map:
    title_image_key: "title"
    images_key: "images"
  pagination:
    size: 6
  buckets:
    car-image: cars
    make-image: makes
  profile-url: http://localhost:9090/realms/rental-service-realm/account
  keycloak:
    server-url: http://localhost:9090
    realm: rental-service-realm
    admin-client-id: admin-cli
    admin-username: ${KEYCLOAK_ADMIN_NAME:developer}
    admin-password: ${KEYCLOAK_ADMIN_PASSWORD:developer}
  firebase:
    service-account: ${FIREBASE_SERVICE_ACCOUNT:}
    vapid-key: ${FIREBASE_VAPID_KEY:}
    web:
      api-key: ${FIREBASE_API_KEY:}
      auth-domain: ${FIREBASE_AUTH_DOMAIN:}
      project-id: ${FIREBASE_PROJECT_ID:}
      storage-bucket: ${FIREBASE_STORAGE_BUCKET:}
      messaging-sender-id: ${FIREBASE_MESSAGING_SENDER_ID:}
      app-id: ${FIREBASE_APP_ID:}

minio:
  url:
    time-to-live: 7
  access-key: ${MINIO_ROOT_USER:developer}
  secret-key: ${MINIO_ROOT_PASSWORD:developer}
  endpoint: http://localhost:9000
  public-url: http://localhost:9000
  default-bucket: developer